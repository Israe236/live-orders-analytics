name: realtime-analytics-dashboard

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rad}
      POSTGRES_DB: ${POSTGRES_DB:-rad}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql (not .../data as in <=17).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    image: realtime-analytics-dashboard/backend:local
    environment:
      RAD_DATABASE_URL: postgresql://${POSTGRES_USER:-rad}:${POSTGRES_PASSWORD:-rad}@postgres:5432/${POSTGRES_DB:-rad}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl; Python is already there.
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://localhost:8000/health', timeout=2).status != 200)"
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  generator:
    build: ./backend
    image: realtime-analytics-dashboard/backend:local
    command: ["python", "-m", "rad.generator"]
    environment:
      RAD_GEN_API_URL: http://api:8000
      RAD_GEN_EVENTS_PER_SECOND: ${GEN_EVENTS_PER_SECOND:-20}
      RAD_GEN_TIME_COMPRESSION: ${GEN_TIME_COMPRESSION:-1}
      RAD_GEN_INVALID_RATIO: ${GEN_INVALID_RATIO:-0.01}
      RAD_GEN_BURSTS_PER_HOUR: ${GEN_BURSTS_PER_HOUR:-4}
      RAD_GEN_ANOMALIES_PER_HOUR: ${GEN_ANOMALIES_PER_HOUR:-2}
      # Longer than the 3-minute alert window, so an anomaly is visible to the alert rules.
      RAD_GEN_ANOMALY_DURATION_S: ${GEN_ANOMALY_DURATION_S:-240}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web-react:
    build:
      context: ./frontends
      dockerfile: web-react/Dockerfile
    ports:
      - "${WEB_REACT_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web-angular:
    build:
      context: ./frontends
      dockerfile: web-angular/Dockerfile
    ports:
      - "${WEB_ANGULAR_PORT:-4200}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
