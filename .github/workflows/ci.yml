name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rad
          POSTGRES_PASSWORD: rad
          POSTGRES_DB: rad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rad -d rad"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
        env:
          RAD_TEST_DATABASE_URL: postgresql://rad:rad@localhost:5432/rad_test

  frontends:
    name: Frontends (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends
    env:
      NG_CLI_ANALYTICS: "false"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontends/package-lock.json
      - run: npm ci
      - run: npm run build:core
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Bundle the React Native app for web (Metro)
        working-directory: frontends/mobile-react-native
        run: npx expo export --platform web --output-dir dist

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
