server {
    listen 80;
    root /usr/share/nginx/html;
    charset utf-8;

    # REST: /api/metrics/snapshot -> http://api:8000/metrics/snapshot (same origin, no CORS).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    # WebSocket: HTTP/1.1 + Upgrade headers, and a long read timeout for idle-looking sockets.
    location /ws/ {
        proxy_pass http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Hashed build files never change: cache them for a year. index.html is not cached.
    location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths serve index.html.
    location / {
        try_files $uri /index.html;
    }
}
